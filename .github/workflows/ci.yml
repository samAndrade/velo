# =====================================================================
# Workflow: Continuous Integration
# Propósito: Executar exclusivamente os testes unitários do projeto
#            a cada push na branch "main". Estrutura simples e enxuta,
#            preparada para receber novos jobs/steps no futuro
#            (ex.: lint, build, cobertura, deploy) sem necessidade de
#            reestruturação.
# =====================================================================

name: Continuous Integration

# Gatilho: executa apenas em push na branch main
on:
  push:
    branches:
      - main

# Variáveis globais do workflow
env:
  NODE_VERSION: '24'

jobs:
  # Job único responsável pelos testes unitários
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      # 1. Faz o checkout do código-fonte do repositório
      - name: Checkout repository
        uses: actions/checkout@v6.1.0

      # 2. Configura o Node.js na versão definida em NODE_VERSION
      - name: Setup Node.js
        uses: actions/setup-node@v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # 3. Habilita o Corepack para gerenciar o Yarn corretamente
      - name: Enable Corepack (Yarn)
        run: corepack enable

      # 4. Instala as dependências do projeto usando o yarn.lock
      - name: Install dependencies
        run: yarn install --immutable

      # 5. Executa os testes unitários com Vitest
      - name: Run unit tests
        run: yarn test
